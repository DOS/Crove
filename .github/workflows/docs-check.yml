name: docs-check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, so the migration order step can list what this PR adds.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Docs check
        run: node tools/docs-check.mjs

      # G1 scope, the path half (kernel plan §10, #1560): no path that belongs in the private crove-cloud repository.
      - name: Path boundary (G1)
        run: node tools/ci/path-boundary.mjs

      # G5 PII scan (kernel plan §10, #1628): no citizen ID, mobile number, individual tax code or personal email
      # address in any tracked file. Reads the checkout only; the log masks every value it reports.
      - name: PII scan (G5)
        run: node tools/ci/pii-scan.mjs

      # AGENTS.md: a new migration's version is greater than every file on main. Compared against the live base
      # branch, so re-running this job after main moves catches a PR that fell behind; migration-recheck.yml does
      # that re-run after every push to main.
      - name: Migration order
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          node tools/ci/migration-order.mjs "origin/$BASE_REF" HEAD^1

      # G2 migration-lint (plan §5.5, #1201): the content rules for the migrations this PR adds or changes. The
      # allowlist of files already on main is read from the base branch, so a PR cannot exempt its own file.
      - name: Migration lint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/ci/migration-lint.mjs --allowlist-ref "origin/$BASE_REF" --since HEAD^1
