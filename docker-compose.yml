# Crove self-host: `docker compose up` then open http://localhost:8080.
# Defaults are for local use only. For a real deployment, copy .env.example to .env and change every secret.
name: crove


services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: crove:local
    command: ['migrate']
    environment:
      CROVE_APP_DB_PASSWORD: ${CROVE_APP_DB_PASSWORD:-local-app-password}
      CROVE_WORKER_DB_PASSWORD: ${CROVE_WORKER_DB_PASSWORD:-local-worker-password}
      CROVE_PROBER_DB_PASSWORD: ${CROVE_PROBER_DB_PASSWORD:-local-prober-password}
      CROVE_REPORTER_DB_PASSWORD: ${CROVE_REPORTER_DB_PASSWORD:-local-reporter-password}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth-password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      AUTH_ISSUER: crove-auth
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/postgres
      DATABASE_URL: postgres://crove_app:${CROVE_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:8080}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:-local-auth-password}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:-http://localhost:8080}/**
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      # 15 minutes, defense in depth (ADR-0028); revocation does not rely on it.
      GOTRUE_JWT_EXP: '900'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: crove-auth
      GOTRUE_PASSWORD_MIN_LENGTH: '8'
      # The kernel proxy sets X-Real-IP from the client socket, so rate limits are per client.
      GOTRUE_RATE_LIMIT_HEADER: X-Real-IP
      # Emails per hour for the whole deployment (counted while confirmations are on), and requests per 5 minutes per
      # client address on sign-up, recovery, OTP, resend and user updates. The kernel proxy also caps emails per
      # client (AUTH_EMAIL_CLIENT_LIMIT_PER_HOUR, below), so one client cannot use up this budget (#190).
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${AUTH_RATE_LIMIT_EMAIL_SENT:-100}
      GOTRUE_RATE_LIMIT_OTP: ${AUTH_RATE_LIMIT_OTP:-30}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # true skips email confirmation (local use). Set false with a real SMTP server in production.
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTH_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-noreply@crove.local}
      # The sender name of sign-in mails: the product name users see (BRAND_NAME, #1040).
      GOTRUE_SMTP_SENDER_NAME: ${BRAND_NAME:-Crove}
      # Email links resolve these paths against API_EXTERNAL_URL's origin, so they must include the /auth/v1 proxy prefix.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    # Supabase Auth runs all its migrations before it serves /health, so healthy means its schema is complete.
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', '-T', '3', 'http://127.0.0.1:9999/health']
      interval: 2s
      timeout: 5s
      retries: 60
      # Failures while Supabase Auth migrates do not count, so a long upgrade migration does not fail the stack.
      start_period: 300s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot (ADR-0028): runs once Supabase Auth has finished its migrations (healthy), then lets the session check
  # read exactly the columns it needs, including optional ones such as auth.sessions.oauth_client_id (issue #276)
  # that a grant made mid-migration would miss. Runs on every `up`, so the grant survives a recreated table.
  auth-grants:
    build: .
    image: crove:local
    command: ['auth-grants']
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      AUTH_ISSUER: crove-auth
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/postgres
      DATABASE_URL: postgres://crove_app:${CROVE_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
    depends_on:
      auth:
        condition: service_healthy

  crove:
    build: .
    image: crove:local
    command: ['all']
    restart: unless-stopped
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      AUTH_ISSUER: crove-auth
      AUTH_AUTOCONFIRM: ${AUTH_AUTOCONFIRM:-true}
      # Revocation: read Supabase Auth's sessions in the shared database (needs the auth-grants step).
      AUTH_SESSION_CHECK: db
      # R3 (approve, membership changes) needs MFA in the last 5 minutes; the app asks for a code, or to enable
      # two-factor first. off is accepted on localhost only.
      AUTH_STEP_UP: ${AUTH_STEP_UP:-required}
      DATABASE_URL: postgres://crove_app:${CROVE_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
      WORKER_DATABASE_URL: postgres://crove_worker:${CROVE_WORKER_DB_PASSWORD:-local-worker-password}@db:5432/postgres
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      AUTH_UPSTREAM_URL: http://auth:9999
      # Modules to run (ADR-0031); empty runs every module.
      CROVE_MODULES: ${CROVE_MODULES:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_VISION: ${AI_VISION:-false}
      # The product name users see in the app and in mails (#1040); empty keeps "Crove".
      BRAND_NAME: ${BRAND_NAME:-}
      # The app's feedback and support link (https: or mailto:); empty hides it.
      SUPPORT_URL: ${SUPPORT_URL:-}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      # The public status page PUBLIC_URL/status (#678): the prober's last result, on the shared `status` volume.
      STATUS_FILE: ${STATUS_FILE:-}
      TAX_CODE_LOOKUP_URL: ${TAX_CODE_LOOKUP_URL:-}
      # The assisted purchase-invoice sync from the tax portal (#325); off unless true.
      TAX_PORTAL_SYNC: ${TAX_PORTAL_SYNC:-false}
      TAX_PORTAL_STEP_SECONDS: ${TAX_PORTAL_STEP_SECONDS:-90}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-}
      INBOUND_SECRET: ${INBOUND_SECRET:-}
      # Invite mails go through the same SMTP server as Supabase Auth's (Mailpit at http://localhost:8025 locally).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@crove.local}
      # smtp (above) or resend: Crove's own mails through Resend's API, delivery events through its webhooks (#539).
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Emails Supabase Auth sends per client address and per recipient (#190); the same budget as the auth service,
      # so a public deployment refuses to start when fewer than 10 client addresses could use it up.
      AUTH_RATE_LIMIT_EMAIL_SENT: ${AUTH_RATE_LIMIT_EMAIL_SENT:-100}
      AUTH_EMAIL_CLIENT_LIMIT_PER_HOUR: ${AUTH_EMAIL_CLIENT_LIMIT_PER_HOUR:-5}
      AUTH_EMAIL_ADDRESS_INTERVAL_SECONDS: ${AUTH_EMAIL_ADDRESS_INTERVAL_SECONDS:-60}
      # Who may create an account (#350): open, invite_only or allowlist (with AUTH_SIGNUP_ALLOWED_DOMAINS). Checked by
      # this service's /auth/v1 proxy, so the auth service keeps GOTRUE_DISABLE_SIGNUP=false (AUTH_DISABLE_SIGNUP) for it.
      AUTH_SIGNUP_POLICY: ${AUTH_SIGNUP_POLICY:-open}
      AUTH_SIGNUP_ALLOWED_DOMAINS: ${AUTH_SIGNUP_ALLOWED_DOMAINS:-}
      # Under allowlist, refusals that tell an address is invited, per IPv4 address or IPv6 /48 and per deployment (#564).
      AUTH_SIGNUP_REFUSAL_LIMIT_PER_HOUR: ${AUTH_SIGNUP_REFUSAL_LIMIT_PER_HOUR:-5}
      AUTH_SIGNUP_REFUSAL_GLOBAL_LIMIT_PER_HOUR: ${AUTH_SIGNUP_REFUSAL_GLOBAL_LIMIT_PER_HOUR:-0}
      ORG_CREATE_LIMIT_PER_DAY: ${ORG_CREATE_LIMIT_PER_DAY:-5}
      ORG_CREATE_LIMIT_TOTAL: ${ORG_CREATE_LIMIT_TOTAL:-20}
      INBOUND_ROTATE_LIMIT_PER_DAY: ${INBOUND_ROTATE_LIMIT_PER_DAY:-3}
      INBOUND_ROTATE_LIMIT_TOTAL: ${INBOUND_ROTATE_LIMIT_TOTAL:-50}
      INVITE_LIMIT_PER_RECIPIENT_PER_DAY: ${INVITE_LIMIT_PER_RECIPIENT_PER_DAY:-5}
      REFUSAL_AUDIT_LIMIT_PER_ACTOR: ${REFUSAL_AUDIT_LIMIT_PER_ACTOR:-50}
      REFUSAL_AUDIT_LIMIT_PER_ORG: ${REFUSAL_AUDIT_LIMIT_PER_ORG:-500}
      REFUSAL_AUDIT_RESERVE_PER_ACTOR: ${REFUSAL_AUDIT_RESERVE_PER_ACTOR:-10}
      REFUSAL_AUDIT_WINDOW_SECONDS: ${REFUSAL_AUDIT_WINDOW_SECONDS:-3600}
      REFUSAL_TALLY_RETENTION_DAYS: ${REFUSAL_TALLY_RETENTION_DAYS:-7}
      # Detective security alerts (#996): the worker posts them to the prober's chat (see .env.example).
      SECURITY_ALERT_WINDOW_SECONDS: ${SECURITY_ALERT_WINDOW_SECONDS:-300}
      SECURITY_ALERT_ORG_THRESHOLD: ${SECURITY_ALERT_ORG_THRESHOLD:-20}
      SECURITY_ALERT_REFUSAL_THRESHOLD: ${SECURITY_ALERT_REFUSAL_THRESHOLD:-500}
      SECURITY_ALERT_REPEAT_MINUTES: ${SECURITY_ALERT_REPEAT_MINUTES:-60}
      OUTBOX_LAG_PAUSE_SECONDS: ${OUTBOX_LAG_PAUSE_SECONDS:-30}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_INSTANCE: ${ALERT_INSTANCE:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-auto}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      # Per-org daily abuse limits (#675, see .env.example).
      ORG_LIMIT_INBOUND_EMAILS_PER_DAY: ${ORG_LIMIT_INBOUND_EMAILS_PER_DAY:-300}
      ORG_LIMIT_ATTACHMENT_MB_PER_DAY: ${ORG_LIMIT_ATTACHMENT_MB_PER_DAY:-1000}
      ORG_LIMIT_EXTRACTION_PAGES_PER_DAY: ${ORG_LIMIT_EXTRACTION_PAGES_PER_DAY:-1500}
      ORG_LIMIT_AI_COST_PER_DAY: ${ORG_LIMIT_AI_COST_PER_DAY:-20}
      AI_PRICE_INPUT_PER_MTOK: ${AI_PRICE_INPUT_PER_MTOK:-0}
      AI_PRICE_OUTPUT_PER_MTOK: ${AI_PRICE_OUTPUT_PER_MTOK:-0}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
      # Realtime invalidation over SSE (/api/stream): one LISTEN connection per API process (see .env.example).
      STREAM_MAX_CONNECTIONS: ${STREAM_MAX_CONNECTIONS:-500}
      STREAM_MAX_PER_USER: ${STREAM_MAX_PER_USER:-5}
      STREAM_RECHECK_SECONDS: ${STREAM_RECHECK_SECONDS:-30}
      STREAM_RECHECK_CONCURRENCY: ${STREAM_RECHECK_CONCURRENCY:-3}
      # Org exports (issue #212): kept EXPORT_RETENTION_DAYS (35 to 90), sealed with EXPORT_ENCRYPTION_KEY (required
      # on a public PUBLIC_URL; see .env.example).
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-35}
      EXPORT_ENCRYPTION_KEY: ${EXPORT_ENCRYPTION_KEY:-}
      EXPORT_ENCRYPTION_KEY_PREVIOUS: ${EXPORT_ENCRYPTION_KEY_PREVIOUS:-}
      # Days after an org's newest export before the operator's org-purge may close it (issue #1024, 30 at least).
      ORG_PURGE_MIN_DAYS: ${ORG_PURGE_MIN_DAYS:-30}
      # Files stay on the `files` volume unless STORAGE=s3 (see .env.example).
      STORAGE: ${STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # The WORM fact stream (#891): read-only files on the `archive` volume unless ARCHIVE_STORE=s3 with an Object Lock
      # bucket (docs/runbooks/worm-archive.md).
      ARCHIVE_STORE: ${ARCHIVE_STORE:-local}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-}
      ARCHIVE_LOCK_MODE: ${ARCHIVE_LOCK_MODE:-GOVERNANCE}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-3650}
      ARCHIVE_LAG_SECONDS: ${ARCHIVE_LAG_SECONDS:-600}
      S3_VERSIONING: ${S3_VERSIONING:-required}
      # Retention holds on posted invoice files with STORAGE=s3 (#1009, docs/runbooks/evidence-holds.md); 0: none.
      EVIDENCE_LOCK_DAYS: ${EVIDENCE_LOCK_DAYS:-3650}
      S3_PRESIGNED_URLS: ${S3_PRESIGNED_URLS:-true}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      UPLOAD_COMPLETE_CONCURRENCY: ${UPLOAD_COMPLETE_CONCURRENCY:-4}
      UPLOAD_BEGIN_LIMIT_PER_MINUTE: ${UPLOAD_BEGIN_LIMIT_PER_MINUTE:-20}
      # Every PDF, XML and MIME parse happens in crove-extract (External-tenant gate T12).
      EXTRACT_URL: http://crove-extract:8090
      # Seals channel tokens (ADR-0025). Set CREDENTIAL_KEY to bring your own; otherwise the container creates a key
      # file on the `keys` volume at first start. Back it up apart from the database (docs/runbooks/credential-key.md).
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
      CREDENTIAL_KEY_PREVIOUS: ${CREDENTIAL_KEY_PREVIOUS:-}
      CREDENTIAL_KEY_FILE: /data/keys/credential.key
      CHANNEL_SANDBOX: ${CHANNEL_SANDBOX:-true}
      CHANNEL_BLUESKY: ${CHANNEL_BLUESKY:-true}
      CHANNEL_TELEGRAM: ${CHANNEL_TELEGRAM:-true}
      CHANNEL_MASTODON: ${CHANNEL_MASTODON:-true}
      CHANNEL_DISCORD: ${CHANNEL_DISCORD:-true}
      CHANNEL_WORDPRESS: ${CHANNEL_WORDPRESS:-true}
      CHANNEL_META_APP_ID: ${CHANNEL_META_APP_ID:-}
      CHANNEL_META_APP_SECRET: ${CHANNEL_META_APP_SECRET:-}
      CHANNEL_ZALO_APP_ID: ${CHANNEL_ZALO_APP_ID:-}
      CHANNEL_ZALO_APP_SECRET: ${CHANNEL_ZALO_APP_SECRET:-}
      CHANNEL_THREADS_APP_ID: ${CHANNEL_THREADS_APP_ID:-}
      CHANNEL_THREADS_APP_SECRET: ${CHANNEL_THREADS_APP_SECRET:-}
      CHANNEL_LINKEDIN_CLIENT_ID: ${CHANNEL_LINKEDIN_CLIENT_ID:-}
      CHANNEL_LINKEDIN_CLIENT_SECRET: ${CHANNEL_LINKEDIN_CLIENT_SECRET:-}
      CHANNEL_LINKEDIN_ORGANIZATIONS: ${CHANNEL_LINKEDIN_ORGANIZATIONS:-false}
      CHANNEL_LINKEDIN_PAGE_CLIENT_ID: ${CHANNEL_LINKEDIN_PAGE_CLIENT_ID:-}
      CHANNEL_LINKEDIN_PAGE_CLIENT_SECRET: ${CHANNEL_LINKEDIN_PAGE_CLIENT_SECRET:-}
      CHANNEL_GOOGLE_CLIENT_ID: ${CHANNEL_GOOGLE_CLIENT_ID:-}
      CHANNEL_GOOGLE_CLIENT_SECRET: ${CHANNEL_GOOGLE_CLIENT_SECRET:-}
      CHANNEL_GOOGLE_BUSINESS: ${CHANNEL_GOOGLE_BUSINESS:-false}
      CHANNEL_TIKTOK_CLIENT_KEY: ${CHANNEL_TIKTOK_CLIENT_KEY:-}
      CHANNEL_TIKTOK_CLIENT_SECRET: ${CHANNEL_TIKTOK_CLIENT_SECRET:-}
      CHANNEL_TIKTOK_VIDEO_LIST: ${CHANNEL_TIKTOK_VIDEO_LIST:-false}
      CHANNEL_TIKTOK_INBOX: ${CHANNEL_TIKTOK_INBOX:-false}
      CHANNEL_X_CLIENT_ID: ${CHANNEL_X_CLIENT_ID:-}
      CHANNEL_X_CLIENT_SECRET: ${CHANNEL_X_CLIENT_SECRET:-}
      CHANNEL_PINTEREST_APP_ID: ${CHANNEL_PINTEREST_APP_ID:-}
      CHANNEL_PINTEREST_APP_SECRET: ${CHANNEL_PINTEREST_APP_SECRET:-}
    volumes:
      - files:/data/files
      - archive:/data/archive
      - keys:/data/keys
      - status:/data/status:ro
    ports:
      # Loopback only. Put a TLS reverse proxy in front (and set PUBLIC_URL) to serve other machines.
      - '127.0.0.1:${PORT:-8080}:8080'
    networks:
      - default
      - extract
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      auth-grants:
        condition: service_completed_successfully
      crove-extract:
        condition: service_healthy

  # The parsing sandbox (plan §7.6). Bytes in, JSON out; only the worker calls it. No environment on purpose: it
  # holds no credentials and refuses to start with any. Its only network is `extract`, which has no route out,
  # and no port is published. Each parse also runs in a short-lived process with no network permission.
  crove-extract:
    build:
      context: .
      dockerfile: apps/extract/Dockerfile
    image: crove-extract:local
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 128
    networks:
      - extract

  # Health prober and alerts (plan §4.13), off by default: `docker compose --profile prober up -d`. Checks every
  # PROBER_INTERVAL_SECONDS and posts to ALERT_WEBHOOK_URL (stdout when unset). Test the path with
  # `docker compose run --rm prober prober --test-alert`; one check with `docker compose run --rm prober prober`.
  prober:
    build: .
    image: crove:local
    profiles: ['prober']
    command: ['prober', '--every', '${PROBER_INTERVAL_SECONDS:-300}']
    restart: unless-stopped
    # The image's healthcheck probes the API port, which the prober does not open.
    healthcheck:
      disable: true
    environment:
      PROBER_DATABASE_URL: postgres://crove_prober:${CROVE_PROBER_DB_PASSWORD:-local-prober-password}@db:5432/postgres
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_INSTANCE: ${ALERT_INSTANCE:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-auto}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_REPEAT_MINUTES: ${ALERT_REPEAT_MINUTES:-60}
      PROBER_HEARTBEAT_URL: ${PROBER_HEARTBEAT_URL:-}
      # Pinged by `prober --backup-ok` after each complete backup (tools/backup/backup.sh, issue #351).
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      # Each probe's result for the status page; the API reads the same file as STATUS_FILE.
      PROBER_STATUS_FILE: ${STATUS_FILE:-}
      PROBER_MAX_OUTBOX_AGE_SECONDS: ${PROBER_MAX_OUTBOX_AGE_SECONDS:-300}
      PROBER_MAX_JOB_AGE_SECONDS: ${PROBER_MAX_JOB_AGE_SECONDS:-900}
      PROBER_MAX_HEARTBEAT_AGE_SECONDS: ${PROBER_MAX_HEARTBEAT_AGE_SECONDS:-120}
      PROBER_MAX_DEAD_LETTERS: ${PROBER_MAX_DEAD_LETTERS:-0}
      # Unset: the probe interval plus 60 s, so each dead letter alerts once (twice at most).
      PROBER_DEAD_LETTER_WINDOW_SECONDS: ${PROBER_DEAD_LETTER_WINDOW_SECONDS:-}
    volumes:
      - status:/data/status
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Weekly usage report for the operator (issue #311), never started by `up`:
  # `docker compose run --rm usage usage-report [--weeks 8] [--by-org] [--csv] [--post]`; --post sends a summary of
  # the last complete week to the alert webhook (issue #344).
  usage:
    build: .
    image: crove:local
    profiles: ['usage']
    command: ['usage-report']
    restart: 'no'
    healthcheck:
      disable: true
    environment:
      REPORTER_DATABASE_URL: postgres://crove_reporter:${CROVE_REPORTER_DB_PASSWORD:-local-reporter-password}@db:5432/postgres
      # The prober's webhook settings, used only by --post.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_INSTANCE: ${ALERT_INSTANCE:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-auto}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - '127.0.0.1:8025:8025'

networks:
  default:
  # Internal: containers on it reach each other, never the internet.
  extract:
    internal: true

volumes:
  db-data:
  files:
  archive:
  keys:
  # The prober's last result for the status page (#678): written by the prober, read by the API.
  status:
