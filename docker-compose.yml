# Crove self-host: `docker compose up` then open http://localhost:8080.
# Defaults are for local use only. For a real deployment, copy .env.example to .env and change every secret.
name: crove


services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: crove:local
    command: ['migrate']
    environment:
      CROVE_APP_DB_PASSWORD: ${CROVE_APP_DB_PASSWORD:-local-app-password}
      CROVE_WORKER_DB_PASSWORD: ${CROVE_WORKER_DB_PASSWORD:-local-worker-password}
      CROVE_PROBER_DB_PASSWORD: ${CROVE_PROBER_DB_PASSWORD:-local-prober-password}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth-password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      AUTH_ISSUER: crove-auth
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/postgres
      DATABASE_URL: postgres://crove_app:${CROVE_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:8080}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:-local-auth-password}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:-http://localhost:8080}/**
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      # 15 minutes, defense in depth (ADR-0028); revocation does not rely on it.
      GOTRUE_JWT_EXP: '900'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: crove-auth
      GOTRUE_PASSWORD_MIN_LENGTH: '8'
      # The kernel proxy sets X-Real-IP from the client socket, so rate limits are per client.
      GOTRUE_RATE_LIMIT_HEADER: X-Real-IP
      # Emails per hour for the whole deployment (counted while confirmations are on), and requests per 5 minutes per
      # client address on sign-up, recovery, OTP, resend and user updates. The kernel proxy also caps emails per
      # client (AUTH_EMAIL_CLIENT_LIMIT_PER_HOUR, below), so one client cannot use up this budget (#190).
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${AUTH_RATE_LIMIT_EMAIL_SENT:-100}
      GOTRUE_RATE_LIMIT_OTP: ${AUTH_RATE_LIMIT_OTP:-30}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # true skips email confirmation (local use). Set false with a real SMTP server in production.
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTH_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-noreply@crove.local}
      GOTRUE_SMTP_SENDER_NAME: Crove
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot (ADR-0028): waits until Supabase Auth has created auth.sessions and auth.users, then lets the session
  # check read exactly the columns it needs. Runs on every `up`, so the grant survives a recreated table.
  auth-grants:
    build: .
    image: crove:local
    command: ['auth-grants']
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      AUTH_ISSUER: crove-auth
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/postgres
      DATABASE_URL: postgres://crove_app:${CROVE_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
    depends_on:
      auth:
        condition: service_started

  crove:
    build: .
    image: crove:local
    command: ['all']
    restart: unless-stopped
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
      AUTH_ISSUER: crove-auth
      AUTH_AUTOCONFIRM: ${AUTH_AUTOCONFIRM:-true}
      # Revocation: read Supabase Auth's sessions in the shared database (needs the auth-grants step).
      AUTH_SESSION_CHECK: db
      # R3 (approve, membership changes) needs MFA in the last 5 minutes. off is accepted on localhost only, until
      # the MFA enrollment screens ship (issue #32).
      AUTH_STEP_UP: ${AUTH_STEP_UP:-off}
      DATABASE_URL: postgres://crove_app:${CROVE_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
      WORKER_DATABASE_URL: postgres://crove_worker:${CROVE_WORKER_DB_PASSWORD:-local-worker-password}@db:5432/postgres
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      AUTH_UPSTREAM_URL: http://auth:9999
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-}
      INBOUND_SECRET: ${INBOUND_SECRET:-}
      # Invite mails go through the same SMTP server as Supabase Auth's (Mailpit at http://localhost:8025 locally).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@crove.local}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Emails Supabase Auth sends per client address and per recipient (#190); the same budget as the auth service,
      # so a public deployment refuses to start when fewer than 10 client addresses could use it up.
      AUTH_RATE_LIMIT_EMAIL_SENT: ${AUTH_RATE_LIMIT_EMAIL_SENT:-100}
      AUTH_EMAIL_CLIENT_LIMIT_PER_HOUR: ${AUTH_EMAIL_CLIENT_LIMIT_PER_HOUR:-5}
      AUTH_EMAIL_ADDRESS_INTERVAL_SECONDS: ${AUTH_EMAIL_ADDRESS_INTERVAL_SECONDS:-60}
      ORG_CREATE_LIMIT_PER_DAY: ${ORG_CREATE_LIMIT_PER_DAY:-5}
      ORG_CREATE_LIMIT_TOTAL: ${ORG_CREATE_LIMIT_TOTAL:-20}
      INBOUND_ROTATE_LIMIT_PER_DAY: ${INBOUND_ROTATE_LIMIT_PER_DAY:-3}
      INBOUND_ROTATE_LIMIT_TOTAL: ${INBOUND_ROTATE_LIMIT_TOTAL:-50}
      REFUSAL_AUDIT_LIMIT_PER_ACTOR: ${REFUSAL_AUDIT_LIMIT_PER_ACTOR:-50}
      REFUSAL_AUDIT_LIMIT_PER_ORG: ${REFUSAL_AUDIT_LIMIT_PER_ORG:-500}
      REFUSAL_AUDIT_WINDOW_SECONDS: ${REFUSAL_AUDIT_WINDOW_SECONDS:-3600}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
      # Files stay on the `files` volume unless STORAGE=s3 (see .env.example).
      STORAGE: ${STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # Every PDF, XML and MIME parse happens in crove-extract (External-tenant gate T12).
      EXTRACT_URL: http://crove-extract:8090
    volumes:
      - files:/data/files
    ports:
      # Loopback only. Put a TLS reverse proxy in front (and set PUBLIC_URL) to serve other machines.
      - '127.0.0.1:${PORT:-8080}:8080'
    networks:
      - default
      - extract
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      auth-grants:
        condition: service_completed_successfully
      crove-extract:
        condition: service_healthy

  # The parsing sandbox (plan §7.6). Bytes in, JSON out; only the worker calls it. No environment on purpose: it
  # holds no credentials and refuses to start with any. Its only network is `extract`, which has no route out,
  # and no port is published. Each parse also runs in a short-lived process with no network permission.
  crove-extract:
    build:
      context: .
      dockerfile: apps/extract/Dockerfile
    image: crove-extract:local
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 128
    networks:
      - extract

  # Health prober and alerts (plan §4.13), off by default: `docker compose --profile prober up -d`. Checks every
  # PROBER_INTERVAL_SECONDS and posts to ALERT_WEBHOOK_URL (stdout when unset). Test the path with
  # `docker compose run --rm prober prober --test-alert`; one check with `docker compose run --rm prober prober`.
  prober:
    build: .
    image: crove:local
    profiles: ['prober']
    command: ['prober', '--every', '${PROBER_INTERVAL_SECONDS:-300}']
    restart: unless-stopped
    # The image's healthcheck probes the API port, which the prober does not open.
    healthcheck:
      disable: true
    environment:
      PROBER_DATABASE_URL: postgres://crove_prober:${CROVE_PROBER_DB_PASSWORD:-local-prober-password}@db:5432/postgres
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_INSTANCE: ${ALERT_INSTANCE:-}
      PROBER_MAX_OUTBOX_AGE_SECONDS: ${PROBER_MAX_OUTBOX_AGE_SECONDS:-300}
      PROBER_MAX_JOB_AGE_SECONDS: ${PROBER_MAX_JOB_AGE_SECONDS:-900}
      PROBER_MAX_HEARTBEAT_AGE_SECONDS: ${PROBER_MAX_HEARTBEAT_AGE_SECONDS:-120}
      PROBER_MAX_DEAD_LETTERS: ${PROBER_MAX_DEAD_LETTERS:-0}
      # Unset: the probe interval plus 60 s, so each dead letter alerts once (twice at most).
      PROBER_DEAD_LETTER_WINDOW_SECONDS: ${PROBER_DEAD_LETTER_WINDOW_SECONDS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - '127.0.0.1:8025:8025'

networks:
  default:
  # Internal: containers on it reach each other, never the internet.
  extract:
    internal: true

volumes:
  db-data:
  files:
