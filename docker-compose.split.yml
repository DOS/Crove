# Split roles on S3 storage (External-tenant gate T7): `api` and `worker` run as separate containers from the same
# image, with STORAGE=s3 against MinIO and no shared files volume. An override of docker-compose.yml:
#
#   export CROVE_CONTEXT_TOKEN_KEY="$(openssl rand -base64 32)"
#   docker compose -p crove-split -f docker-compose.yml -f docker-compose.split.yml up -d --build
#   node tools/e2e/split-stack.mjs
#   docker compose -p crove-split -f docker-compose.yml -f docker-compose.split.yml down -v
#   docker image rm crove:split crove-extract:split
#
# The CI job `split-stack` in .github/workflows/ci.yml runs exactly this. The all-in-one `crove` service is moved
# to the `all-in-one` profile, so it does not start. Images are tagged :split so a running default stack keeps its
# own. Every secret here is a throwaway value for local use; the API listens on 127.0.0.1:${SPLIT_PORT:-18080}.
# The project name below keeps it apart from the default `crove` stack (and its database) even without `-p`.
name: crove-split

x-crove-env: &crove-env
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
  AUTH_ISSUER: crove-auth
  AUTH_AUTOCONFIRM: 'true'
  AUTH_SESSION_CHECK: db
  AUTH_STEP_UP: 'off'
  AUTH_UPSTREAM_URL: http://auth:9999
  DATABASE_URL: postgres://crove_app:${CROVE_APP_DB_PASSWORD:-local-app-password}@db:5432/postgres
  # The context token key (#1822) from the environment: api and worker mount no volume here (T7), so not the key file
  # migrate would create. Generate one per run: CROVE_CONTEXT_TOKEN_KEY="$(openssl rand -base64 32)".
  CROVE_CONTEXT_TOKEN_KEY: ${CROVE_CONTEXT_TOKEN_KEY:?set CROVE_CONTEXT_TOKEN_KEY, for example to the output of openssl rand -base64 32}
  PUBLIC_URL: http://localhost:${SPLIT_PORT:-18080}
  INBOUND_DOMAIN: inbound.crove.test
  INBOUND_SECRET: split-stack-inbound-secret-0123456789abcdef
  STORAGE: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: crove-files
  S3_ACCESS_KEY_ID: crove-split
  S3_SECRET_ACCESS_KEY: crove-split-minio-secret
  S3_FORCE_PATH_STYLE: 'true'
  # The bucket is versioned (minio-init), as evidence buckets must be (ADR-0013). MinIO's port is not published, so
  # browsers could not reach presigned URLs: transfers stream through the kernel, downloads pinned to the version.
  S3_VERSIONING: required
  S3_PRESIGNED_URLS: 'false'

services:
  migrate:
    image: crove:split

  # Same URLs and sign-up settings as the API below, whatever a local .env says.
  auth:
    environment:
      API_EXTERNAL_URL: http://localhost:${SPLIT_PORT:-18080}/auth/v1
      GOTRUE_SITE_URL: http://localhost:${SPLIT_PORT:-18080}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${SPLIT_PORT:-18080}/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'

  auth-grants:
    image: crove:split

  crove:
    image: crove:split
    profiles: ['all-in-one']

  crove-extract:
    image: crove-extract:split

  # Same image and digest as the MinIO in the CI `check` job. Not on the `extract` network: the sandbox has no route
  # to the blobs. No port is published; tools/e2e/split-stack.mjs lists the bucket with `mc` inside the container.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: crove-split
      MINIO_ROOT_PASSWORD: crove-split-minio-secret
      # For `docker compose exec minio mc ...`.
      MC_HOST_local: http://crove-split:crove-split-minio-secret@127.0.0.1:9000
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    entrypoint: ['sh', '-c']
    # crove-archive: the WORM fact stream (#891) needs a bucket created with Object Lock (which also turns versioning on).
    # crove-split-prober (#2094): the prober's own user, which can only list that bucket and read its verify/ and chain/
    # objects, as docs/runbooks/worm-archive.md advises for a deployment. Attaching a policy twice fails, so it is detached
    # first (which fails the first time, hence the `|| true`): a second run of this container, with volumes kept across two
    # `up`s, then works too.
    command:
      - |
        set -e
        mc mb --ignore-existing local/crove-files
        mc version enable local/crove-files
        mc mb --ignore-existing --with-lock local/crove-archive
        cat > /tmp/archive-reader.json <<'POLICY'
        {"Version": "2012-10-17", "Statement": [
          {"Effect": "Allow", "Action": ["s3:ListBucket", "s3:ListBucketVersions"], "Resource": ["arn:aws:s3:::crove-archive"]},
          {"Effect": "Allow", "Action": ["s3:GetObject"], "Resource": ["arn:aws:s3:::crove-archive/verify/*", "arn:aws:s3:::crove-archive/chain/*"]}
        ]}
        POLICY
        mc admin policy create local archive-reader /tmp/archive-reader.json
        mc admin user add local crove-split-prober crove-split-prober-secret
        mc admin policy detach local archive-reader --user crove-split-prober || true
        mc admin policy attach local archive-reader --user crove-split-prober
    environment:
      MC_HOST_local: http://crove-split:crove-split-minio-secret@minio:9000
    depends_on:
      minio:
        condition: service_healthy

  # HTTP API and web UI only. It stores uploads and inbound mail in the bucket and never calls crove-extract, so it
  # is not on the `extract` network.
  api:
    build: .
    image: crove:split
    command: ['api']
    restart: unless-stopped
    environment:
      <<: *crove-env
    ports:
      - '127.0.0.1:${SPLIT_PORT:-18080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      auth-grants:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Outbox relay and jobs: reads the blobs the API stored, has crove-extract parse them and files the results.
  worker:
    build: .
    image: crove:split
    command: ['worker']
    restart: unless-stopped
    # The image's healthcheck probes the API port, which the worker does not open.
    healthcheck:
      disable: true
    environment:
      <<: *crove-env
      WORKER_DATABASE_URL: postgres://crove_worker:${CROVE_WORKER_DB_PASSWORD:-local-worker-password}@db:5432/postgres
      EXTRACT_URL: http://crove-extract:8090
      # The WORM fact stream (#891) in the Object Lock bucket, with the shortest lag so the run sees a batch.
      ARCHIVE_STORE: s3
      ARCHIVE_S3_BUCKET: crove-archive
      ARCHIVE_LAG_SECONDS: '60'
    networks:
      - default
      - extract
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth-grants:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      crove-extract:
        condition: service_healthy

  # The prober (profile `prober`) asks Supabase Auth through the API's /auth/v1 proxy: `crove` does not run here (#1994).
  prober:
    # The image built for this stack, like api and worker, so the probe the end-to-end script runs is of this checkout's code
    # (the base file names crove:local, which an earlier run may have left behind).
    image: crove:split
    # Its bucket and its MinIO user (#2094) exist once minio-init is done, so the first probe finds them.
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      PROBER_AUTH_URL: ${PROBER_AUTH_URL:-http://api:8080/auth/v1}
      # The verification markers (#2082) are in the worker's archive bucket on MinIO, not on the archive volume.
      ARCHIVE_STORE: s3
      ARCHIVE_S3_BUCKET: crove-archive
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      # The read-only user minio-init makes for it (#2094), never the worker's key.
      PROBER_ARCHIVE_S3_ACCESS_KEY_ID: crove-split-prober
      PROBER_ARCHIVE_S3_SECRET_ACCESS_KEY: crove-split-prober-secret

  # Not needed here (sign-up is auto-confirmed); published ports would clash with a running default stack.
  mailpit:
    ports: !reset []
